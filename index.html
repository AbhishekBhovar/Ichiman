</style></head><body><div class="splash" id="splash"><img src="splash.png" alt=""><div class="load"><i></i></div></div><div id="app"><header class="top"><span class="brand">10K</span><button class="grade" onclick="openDialog('belts')" id="grade">WHITE BELT ⌄</button><button onclick="openDialog('settings')" aria-label="Settings">⚙</button></header>
<section class="page on" id="home"></section><section class="page" id="train"></section><section class="page" id="focus"></section><section class="page" id="journey"></section><section class="page" id="achievements"></section><section class="page" id="results"></section><section class="page" id="milestones"></section><nav class="bottom" id="nav"><button data-page="home"><i>⌂</i>HOME</button><button data-page="train"><i>⚔</i>TRAIN</button><button data-page="journey"><i>△</i>JOURNEY</button><button data-page="achievements"><i>✦</i>EMBLEMS</button></nav></div><div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div><script>
const T=[{"id":"chudan","name":"Chudan Tsuki","english":"Mid-level Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"jodan","name":"Jodan Tsuki","english":"Head-level Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"shita","name":"Shita Tsuki","english":"Short Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"hijiate","name":"Hijiate","english":"Rising Elbow Strike","category":"strikes","belt":"white","needsCheck":false},{"id":"mawashi-empi","name":"Mawashi Empi","english":"Round Elbow Strike","category":"strikes","belt":"white","needsCheck":false},{"id":"ura","name":"Ura Uchi","english":"Forward Back Fist","category":"strikes","belt":"white","needsCheck":false},{"id":"yoko-ura","name":"Yoko Ura Uchi","english":"Side Back Fist","category":"strikes","belt":"white","needsCheck":false},{"id":"jodan-age","name":"Jodan Age Uke","english":"Head-level / Rising Block","category":"blocks","belt":"white","needsCheck":false},{"id":"uchi-uke","name":"Uchi Uke","english":"Inside Hooking Block","category":"blocks","belt":"white","needsCheck":false},{"id":"soto-uke","name":"Soto Uke","english":"Outside Hooking Block","category":"blocks","belt":"white","needsCheck":false},{"id":"gedan-barai","name":"Gedan Barai","english":"Downward Block","category":"blocks","belt":"white","needsCheck":false},{"id":"gedan-uke","name":"Gedan Uke","english":"Sweeping Block","category":"blocks","belt":"white","needsCheck":false},{"id":"mae-geri","name":"Mae Geri","english":"Front Kick","category":"kicks","belt":"white","needsCheck":false},{"id":"shuto-uchi","name":"Shuto Uchi","english":"Outside Knife-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"gyaku-shuto","name":"Gyaku Shuto Uchi","english":"Inside Knife-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"haito","name":"Haito","english":"Ridge-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"chuge","name":"Chu-ge Uke","english":"Double Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"kake","name":"Kake Uke","english":"Open-hand Hook Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"mawashi-uke","name":"Mawashi Uke","english":"Open-hand Round Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"shuto-uke","name":"Shuto Uke","english":"Knife-hand Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"kensetsu","name":"Kensetsu Geri","english":"Knee Thrust Kick","category":"kicks","belt":"blue","needsCheck":true},{"id":"mikazuki","name":"Mikazuki Geri","english":"Crescent Kick","category":"kicks","belt":"blue","needsCheck":true},{"id":"sukui","name":"Sukui Uke","english":"Scooping Block","category":"blocks","belt":"blue","needsCheck":true},{"id":"dan-tsuki","name":"Dan Tsuki","english":"Simultaneous Double Punch","category":"strikes","belt":"blue","needsCheck":true},{"id":"jiten-ushiro","name":"Jiten Ushiro Geri","english":"Spinning Back Kick","category":"kicks","belt":"brown","needsCheck":true},{"id":"ushiro-mawashi","name":"Ushiro Mawashi Geri","english":"Hook Kick","category":"kicks","belt":"brown","needsCheck":true}];const VIDEOS={"chudan":"nJsq5MdZPvc","jodan":"N3HZQkTiYLY","shita":"QhwodP4DyL4","hijiate":"F4W7nWH-rlE","mawashi-empi":"ITNIo7X_lhs","ura":"qFQZ6JfOZRU","yoko-ura":"kYK19kIpinw","jodan-age":"jjZaPROr9GE","uchi-uke":"p8SUW-N991o","soto-uke":"mda4VMFBjHI","gedan-barai":"cQC6hqiV5oU","gedan-uke":"z4B6zKTr0_k","mae-geri":"agWU7eFGqys","shuto-uchi":"F7xfeAU9JcU","gyaku-shuto":"gHVbFP8rV24","haito":"3-pMhYGQXgk","chuge":"_dWVRpcV_8Y","kake":"YoptUJcSC9E","mawashi-uke":"rUjVrmRMjW0","shuto-uke":"V3zDedz5yFo"};const BELTS=['white','yellow','orange','green','blue','red','brown','black'];const KEY='ichimanState';let state={selectedBelt:'white',cat:'strikes',actualGrade:'white',reps:{},history:{},activated:{}};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};state.reps ||= {};state.history ||= {};state.activated ||= {};state.migrations ||= {};let currentId='chudan',page='home',session={},sessionStart=0,previousPage='train';const $=id=>document.getElementById(id);const fmt=n=>(n||0).toLocaleString();const sum=()=>T.reduce((n,t)=>n+(state.reps[t.id]||0),0);const unlocked=t=>BELTS.indexOf(t.belt)<=BELTS.indexOf(state.selectedBelt);const accessible=t=>!t.needsCheck||state.activated[t.id];const visible=()=>T.filter(unlocked);const p=t=>Math.min(100,(state.reps[t.id]||0)/100);const totalMax=()=>visible().length*10000;const progress=()=>totalMax()?sum()/totalMax()*100:0;const completed=()=>T.filter(t=>(state.reps[t.id]||0)>=10000).length;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const bar=n=>`<div class="progress"><i style="width:${Math.min(100,n)}%"></i></div>`;const video=t=>VIDEOS[t.id]?`<a class="vid" target="_blank" rel="noopener" href="https://youtu.be/${VIDEOS[t.id]}">▶ VIDEO</a>`:'';
function go(dest){page=dest;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id===dest));document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.page===dest));$('nav').classList.toggle('hide',dest==='focus'||dest==='results'||dest==='milestones');window.scrollTo(0,0);render()}
function render(){let v=visible(),n=sum();$('grade').textContent=state.selectedBelt.toUpperCase()+' BELT ⌄';$('home').innerHTML=`<div class="hero"><div><div class="eyebrow">THE MOUNTAIN SANCTUARY</div><h1>Your journey<br>continues.</h1><p>Every repetition brings you closer.</p><button class="goldbtn" onclick="go('train')">BEGIN TRAINING →</button></div></div><div class="section"><div class="stats"><div class="stat"><b>${fmt(n)}</b><small>LIFETIME REPS</small></div><div class="stat"><b>${completed()}</b><small>10K COMPLETE</small></div><div class="stat"><b>${progress().toFixed(1)}%</b><small>JOURNEY</small></div></div><div class="panel"><div class="panel-head"><b>Path to 10K</b><span>${fmt(n)} repetitions</span></div>${bar(progress())}<p class="note">Your real GKR belt and in-app achievements are separate.</p></div><div class="between"><h2>Continue your practice</h2><button class="secondary" onclick="go('train')">VIEW ALL →</button></div>${v.filter(t=>(state.reps[t.id]||0)>0).slice(0,3).map(techrow).join('')||'<p class="sub">Your first repetition begins your journey.</p>'}</div>`;
$('train').innerHTML=`<div class="section"><div class="eyebrow">THE PRACTICE GROUNDS</div><h2>Choose your discipline</h2><div class="tiles">${[['strikes','STRIKES'],['blocks','BLOCKS'],['kicks','KICKS']].map(([id,label])=>`<button class="tile" onclick="chooseCat('${id}')"><strong>${label}</strong><small>${v.filter(t=>t.category===id).length} techniques →</small></button>`).join('')}</div><h2 style="margin-top:24px" id="techheading">${state.cat.toUpperCase()}</h2><div class="filter">${['strikes','blocks','kicks'].map(x=>`<button class="${state.cat===x?'active':''}" onclick="chooseCat('${x}')">${x.toUpperCase()}</button>`).join('')}</div><div id="techlist">${v.filter(t=>t.category===state.cat).map(techrow).join('')||'<p class="empty">No techniques in this category yet.</p>'}</div></div>`;
let t=T.find(x=>x.id===currentId)||T[0],count=state.reps[t.id]||0,idx=v.findIndex(x=>x.id===t.id);$('focus').innerHTML=`<div class="between" style="padding:13px 18px"><button class="secondary" onclick="go('train')">← TECHNIQUES</button><button class="secondary" onclick="finishSession()">FINISH SESSION</button></div><div class="focus-art">${video(t)}</div><div class="focus-content"><div class="eyebrow">${t.category.toUpperCase()} · ${t.belt.toUpperCase()} BELT</div><h1>${t.name}</h1><div class="sub">${t.english}</div><div class="focus-number"><b>${fmt(count)}</b> <span class="sub">/ 10,000</span></div>${bar(p(t))}${!accessible(t)?`<p class="note">Advanced technique — activate after instructor guidance.</p><button class="goldbtn" onclick="activate('${t.id}')">INSTRUCTOR CHECKED · ACTIVATE</button>`:count>=10000?'<p style="color:var(--gold)">✦ 10K TECHNIQUE COMPLETE</p>':`<div class="repcontrols"><button onclick="rep('${t.id}',10)">+10</button><button class="primary" onclick="rep('${t.id}',100)">+100</button><button onclick="custom('${t.id}')">CUSTOM +</button></div><button class="secondary" onclick="undo('${t.id}')" ${(state.history[t.id]||[]).length?'':'disabled'}>↶ UNDO</button>`}<div class="between" style="margin-top:22px"><button class="secondary" onclick="next(-1)" ${idx<=0?'disabled':''}>← PREVIOUS</button><button class="secondary" onclick="showMilestones('${t.id}')">MILESTONES ✦</button><button class="secondary" onclick="next(1)" ${idx>=v.length-1?'disabled':''}>NEXT →</button></div></div>`;
$('journey').innerHTML=`<div class="section"><div class="eyebrow">THE ASCENT</div><h2>Your mountain journey</h2><div class="journey-art"><div><b style="font:28px Georgia">One step at a time.</b><p class="sub">${fmt(n)} lifetime repetitions</p></div></div><div class="steps">${[[0,'Base Camp','The journey begins'],[1000,'Mountain Trail','1,000 lifetime repetitions'],[5000,'Forest Monastery','5,000 lifetime repetitions'],[15000,'Cliff Sanctuary','15,000 lifetime repetitions'],[50000,'Summit Temple','50,000 lifetime repetitions'],[100000,'The High Pass','100,000 lifetime repetitions']].map(([threshold,name,desc])=>`<div class="step ${n<threshold?'locked':''}"><b>${n>=threshold?'✓ ':'♢ '}${name}</b><small>${desc} ${n<threshold?'· Locked':'· Reached'}</small></div>`).join('')}</div><div class="panel"><b>Training legacy</b><p class="sub">${fmt(n)} reps · ${completed()} completed techniques · ${v.length} techniques available</p>${bar(progress())}</div><h2>Training history</h2>${historyView()}</div>`;

function countFor(t){return state.reps[t.id]||0}function techrow(t){return `<button class="techrow" onclick="openTechnique('${t.id}')"><span class="thumb"></span><span class="techinfo"><b>${t.name}</b><small>${t.english}</small><em>${fmt(countFor(t))} / 10,000 ${countFor(t)>=10000?'✦':''}</em>${bar(p(t))}</span><span class="chev">›</span></button>`}function chooseCat(cat){state.cat=cat;save();render();$('techheading')?.scrollIntoView({block:'start',behavior:'smooth'})}function openTechnique(id){currentId=id;if(!sessionStart){sessionStart=Date.now();session={}}go('focus')}function next(d){let a=visible(),i=a.findIndex(t=>t.id===currentId);if(a[i+d]){currentId=a[i+d].id;go('focus')}}function activate(id){state.activated[id]=true;save();render()}
function rep(id,n){let old=state.reps[id]||0,actual=Math.max(0,Math.min(10000-old,n));if(!actual)return;state.reps[id]=old+actual;(state.history[id]||=([])).push({n:actual,at:Date.now()});session[id]=(session[id]||0)+actual;save();render();if([100,500,1000,2500,5000,7500,10000].some(m=>old<m&&old+actual>=m)){showMilestones(id)}try{navigator.vibrate?.(15)}catch(e){}}function undo(id){let h=state.history[id]||[],last=h.pop();if(!last)return;state.reps[id]=Math.max(0,(state.reps[id]||0)-last.n);session[id]=Math.max(0,(session[id]||0)-last.n);save();render()}function custom(id){openDialog('custom',id)}function finishSession(){let entries=Object.entries(session).filter(([,n])=>n>0),n=entries.reduce((s,[,x])=>s+x,0);$('results').innerHTML=`<div class="result"><div><div class="eyebrow">TRAINING COMPLETE</div><b>+${fmt(n)}</b><p>${entries.length} techniques practised</p></div></div><div class="section">${entries.map(([id,x])=>`<div class="panel between"><span>${T.find(t=>t.id===id)?.name}</span><b style="color:var(--gold)">+${fmt(x)}</b></div>`).join('')||'<p class="sub">No repetitions recorded this session.</p>'}<button class="goldbtn" style="width:100%;margin-top:20px" onclick="session={};sessionStart=0;go('home')">CONTINUE</button></div>`;go('results')}
function showMilestones(id){currentId=id;let t=T.find(x=>x.id===id),n=countFor(t);$('milestones').innerHTML=`<div class="section"><button class="secondary" onclick="go('focus')">← BACK TO TRAINING</button><h2 style="margin-top:25px">${t.name}</h2><p class="sub">${fmt(n)} / 10,000 lifetime repetitions</p>${bar(p(t))}<h2 style="margin-top:25px">Path to mastery</h2>${[100,500,1000,2500,5000,7500,10000].map(m=>`<div class="milestone ${n<m?'locked':''}"><div class="medal">${n>=m?'✦':'♢'}</div><div><b>${fmt(m)} repetitions</b><small>${n>=m?'Milestone achieved':fmt(m-n)+' repetitions to go'}</small></div></div>`).join('')}</div>`;go('milestones')}
function historyView(){let logs=T.flatMap(t=>(state.history[t.id]||[]).filter(h=>h.at).map(h=>({name:t.name,...h}))).sort((a,b)=>b.at-a.at).slice(0,30);return logs.length?logs.map(x=>`<div class="panel between"><div><b>${x.name}</b><div class="sub">${new Date(x.at).toLocaleDateString()}</div></div><b style="color:var(--gold)">+${fmt(x.n)}</b></div>`).join(''):'<p class="sub">Your logged sessions will appear here.</p>'}
function openDialog(type,id){let d=$('dialog');let close=`<button class="secondary close" onclick="closeDialog()">✕</button>`;if(type==='belts')d.innerHTML=close+'<h2>Choose visible belt</h2><p class="note">This changes the techniques displayed, not your official grade.</p>'+BELTS.map(b=>`<button class="secondary" onclick="state.selectedBelt='${b}';save();closeDialog();render()">${b.toUpperCase()} BELT</button>`).join('');if(type==='custom')d.innerHTML=close+`<h2>Add repetitions</h2><p>${T.find(t=>t.id===id).name}</p><input id="customN" type="number" inputmode="numeric" min="1" max="10000" placeholder="Number of repetitions"><div>${[10,25,50,100].map(n=>`<button class="secondary" onclick="$('customN').value=${n}">${n}</button>`).join('')}</div><button class="goldbtn" onclick="let n=+$('customN').value;if(n>0){closeDialog();rep('${id}',n)}">ADD REPS</button>`;if(type==='settings')d.innerHTML=close+`<h2>Settings & backup</h2><label>Actual GKR belt</label><select id="actualGrade">${BELTS.map(b=>`<option value="${b}" ${state.actualGrade===b?'selected':''}>${b.toUpperCase()} BELT</option>`).join('')}</select><button class="goldbtn" onclick="state.actualGrade=$('actualGrade').value;save();closeDialog();render()">SAVE GRADE</button><hr style="border-color:#644a31"><button class="secondary" onclick="exportData()">EXPORT BACKUP</button><label class="secondary" style="display:inline-block;cursor:pointer">IMPORT BACKUP<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><p class="note">Your progress remains in this browser. Export a backup before changing devices or clearing browser data.</p><button class="secondary" onclick="resetData()">RESET ALL PROGRESS</button>`;$('overlay').classList.add('show')}
function closeDialog(){$('overlay').classList.remove('show')}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='10k-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s||typeof s.reps!=='object')throw Error('invalid');state={...state,...s};save();closeDialog();render();alert('Backup imported')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}function resetData(){if(!confirm('Reset ALL repetition counts and training history? This cannot be undone without a backup.'))return;state={selectedBelt:'white',cat:'strikes',actualGrade:'white',reps:{},history:{},activated:{}};save();closeDialog();go('home')}
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.page));if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('splash').remove()}else{setTimeout(()=>$('splash')?.remove(),3400)};render();
</script></body></html>
