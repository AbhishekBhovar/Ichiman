if(page==='focus'){let t=T.find(x=>x.id===current),n=s.reps[t.id]||0;h=`<div class="screen"><div class="row"><button onclick="go('category')">← TECHNIQUES</button><button onclick="finish()">FINISH SESSION</button></div><div class="focusArt" style="background-image:url('${art(t)}');background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#10141b">${vid(t)}</div><div style="text-align:center"><div class="eyebrow">${t.category.toUpperCase()} · ${s.selectedBelt.toUpperCase()} BELT</div><h1>${t.name}</h1><p class="muted">${t.english}</p><h1>${fmt(n)} <small style="font-size:17px;color:#aaa">/ 10,000</small></h1>${bar(pct(t))}${t.needsCheck&&!s.activated[t.id]?`<p class="muted">Instructor confirmation required before logging.</p><button onclick="activate('${t.id}')">CONFIRM INSTRUCTOR CHECK</button>`:`<div class="repbuttons"><button onclick="rep('${t.id}',10)">+10</button><button class="btn-primary" onclick="rep('${t.id}',100)">+100</button><button onclick="modal('custom','${t.id}')">CUSTOM +</button></div><button onclick="undo('${t.id}')" ${!(s.history[t.id]||[]).length?'disabled':''}>↶ UNDO</button>`}<p><button onclick="milestones('${t.id}')">VIEW MILESTONES →</button></p></div></div>`}
if(page==='journey'){let top=T.filter(t=>(s.reps[t.id]||0)>0).sort((a,b)=>(s.reps[b.id]||0)-(s.reps[a.id]||0));h=`<div class="screen journey-screen"><div class="eyebrow">THE PATH OF PRACTICE</div><h1>Your ascent</h1><p class="muted">Your journey is measured in repetitions and techniques mastered. The mountain is your sanctuary, not another achievement to unlock.</p><div class="journey-banner" style="background-image:linear-gradient(0deg,#0b1018e0,#0b101820),url('${envArt(3)}')"><div><span class="eyebrow">LIFETIME PRACTICE</span><strong>${fmt(n)}</strong><span>repetitions across ${T.length} techniques</span></div></div><div class="stats"><div class="stat"><strong>${complete()}</strong><small>MASTERED AT 10K</small></div><div class="stat"><strong>${T.filter(t=>(s.reps[t.id]||0)>0).length}</strong><small>TECHNIQUES STARTED</small></div><div class="stat"><strong>${progress().toFixed(1)}%</strong><small>OVERALL JOURNEY</small></div></div><h2>Your path to mastery</h2>${bar(progress())}<p class="muted">${fmt(n)} of ${fmt(T.length*10000)} lifetime repetitions</p><div class="journey-interlude" style="background-image:linear-gradient(0deg,#0b1018b0,transparent),url('${envArt(4)}')"></div><h2>Techniques in progress</h2>${top.length?top.map(row).join(''):'<p class="muted">Your first session begins your ascent.</p>'}<div class="journey-interlude" style="background-image:linear-gradient(0deg,#0b1018b0,transparent),url('${envArt(5)}')"></div><button class="btn-primary" onclick="go('train')">CONTINUE TRAINING →</button><button onclick="go('progress')">FULL PROGRESS →</button></div>`}
if(page==='emblems'){let got=T.flatMap(t=>M.filter(m=>(s.reps[t.id]||0)>=m).map(m=>({t,m})));h=`<div class="screen emblem-screen"><div class="eyebrow">HALL OF MASTERY</div><h1>Earned emblems</h1><p class="muted">Permanent achievements. Every repetition counts.</p><div class="tabs">${['all','strikes','blocks','kicks'].map(c=>`<button class="${filter===c?'active':''}" onclick="filter='${c}';render()">${c.toUpperCase()}</button>`).join('')}</div>${got.filter(x=>filter==='all'||x.t.category===filter).length?`<div class="medalgrid">${got.filter(x=>filter==='all'||x.t.category===filter).map(({t,m})=>`<button class="medalcell" onclick="milestones('${t.id}')"><img src="${EMBLEM_ART[M.indexOf(m)]}" alt="${fmt(m)} repetition emblem" style="width:76px;height:76px;object-fit:contain"><b>${fmt(m)}</b><small>${t.name}</small></button>`).join('')}</div>`:'<p class="muted">Your first emblem unlocks at 100 repetitions of a technique.</p>'}<h2 style="margin-top:30px">The ten mastery emblems</h2><div class="medalgrid">${M.map((m,i)=>`<div class="medalcell ${T.some(t=>(s.reps[t.id]||0)>=m)?'':'medal-locked'}"><img src="${EMBLEM_ART[i]}" alt="${fmt(m)} emblem" style="width:76px;height:76px;object-fit:contain"><b>${fmt(m)}</b><small>REPETITIONS</small></div>`).join('')}</div><h2 style="margin-top:30px">Technique collection</h2>${visible().filter(t=>filter==='all'||t.category===filter).map(row).join('')}</div>`}
if(page==='milestones'){let t=T.find(x=>x.id===current),n=s.reps[t.id]||0;h=`<div class="screen"><button onclick="go('focus')">← TRAINING</button><h1>${t.name}</h1><p>${fmt(n)} / 10,000</p>${bar(pct(t))}<h2 style="margin-top:25px">Path to 10K</h2><div class="medalgrid">${M.map(m=>`<div class="medalcell ${n<m?'medal-locked':''}"><img src="${EMBLEM_ART[M.indexOf(m)]}" alt="${fmt(m)} repetition emblem" style="width:76px;height:76px;object-fit:contain"><b>${fmt(m)}</b><small>${n>=m?'ACHIEVED':fmt(m-n)+' to go'}</small></div>`).join('')}</div></div>`}
if(page==='progress'){let total=T.length*10000;h=`<div class="screen"><button onclick="go('home')">← HOME</button><div class="eyebrow">YOUR PROGRESS</div><h1>${(100*n/(total||1)).toFixed(1)}%</h1><p>${fmt(n)} / ${fmt(total)} lifetime repetitions</p>${bar(progress())}<div class="scene" style="background-image:url('sanctuary.jpg');margin-top:20px"></div>${['strikes','blocks','kicks'].map(c=>{let a=visible().filter(t=>t.category===c),x=a.reduce((q,t)=>q+(s.reps[t.id]||0),0);return `<div class="panel"><div class="row"><b>${c.toUpperCase()}</b><span>${fmt(x)} / ${fmt(a.length*10000)}</span></div>${bar(a.length?100*x/(a.length*10000):0)}</div>`}).join('')}<button onclick="go('history')">TRAINING HISTORY →</button></div>`}
if(page==='history'){let logs=T.flatMap(t=>(s.history[t.id]||[]).filter(x=>x.at).map(x=>({...x,name:t.name}))).sort((a,b)=>b.at-a.at),d=new Date();d.setMonth(d.getMonth()+monthShift);let y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),start=new Date(y,m,1).getDay(),marked=new Set(logs.map(x=>new Date(x.at).toDateString()));h=`<div class="screen"><button onclick="go('home')">← HOME</button><div class="eyebrow">TRAINING HISTORY</div><h1>Your practice</h1><div class="row"><button onclick="monthShift--;render()">‹</button><b>${d.toLocaleString('en-AU',{month:'long',year:'numeric'})}</b><button onclick="monthShift++;render()">›</button></div><div class="calendar" style="margin:16px 0">${['S','M','T','W','T','F','S'].map(x=>`<div>${x}</div>`).join('')}${Array(start).fill('<div></div>').join('')}${Array.from({length:days},(_,i)=>`<div class="${marked.has(new Date(y,m,i+1).toDateString())?'marked':''}">${i+1}</div>`).join('')}</div><h2>Recent repetitions</h2>${logs.slice(0,40).map(x=>`<div class="panel row"><div><b>${x.name}</b><small class="muted" style="display:block">${new Date(x.at).toLocaleDateString('en-AU')}</small></div><b>+${fmt(x.n)}</b></div>`).join('')||'<p class="muted">Your training history will appear here.</p>'}</div>`}
if(page==='customize')h=`<div class="screen"><button onclick="go('home')">← HOME</button><div class="eyebrow">YOUR KARATEKA</div><h1>Your sanctuary</h1><div class="scene" style="height:310px;background-image:url('karateka.jpg')"></div><p class="muted">Select your preferred training setting. Your actual karate grade is managed separately.</p><h2>Environment</h2><div class="tabs">${['Mountain Dawn','Temple Courtyard','Forest Sanctuary','Mountain Vista','Summit Hall','High Pass'].map((x,i)=>`<button onclick="s.environmentIndex=i;save();render()" class="${Number(s.environmentIndex||0)===i?'active':''}">${x.toUpperCase()}</button>`).join('')}</div><p class="muted">Your chosen approved environment appears on the home screen.</p></div>`;
if(page==='results'){let entries=Object.entries(session).filter(([,n])=>n>0),total=entries.reduce((a,[,x])=>a+x,0);h=`<div class="screen"><div class="scene hero" style="background-image:url('finish.jpg')"><div><div class="eyebrow">TRAINING COMPLETE</div><h1>+${fmt(total)} REPS</h1><p>${entries.length} techniques practised</p></div></div>${entries.map(([id,n])=>`<div class="panel row"><b>${T.find(t=>t.id===id).name}</b><b>+${fmt(n)}</b></div>`).join('')}<button class="btn-primary" onclick="session={};go('home')">CONTINUE →</button></div>`}
$('view').innerHTML=h}
function category(c){cat=c;go('category')}function openTech(id){current=id;cat=T.find(t=>t.id===id).category;go('focus')}function milestones(id){current=id;go('milestones')}
function rep(id,n){let t=T.find(x=>x.id===id);if(t.needsCheck&&!s.activated[id])return;let old=s.reps[id]||0,add=Math.min(10000-old,n);if(add<=0)return;s.reps[id]=old+add;(s.history[id]||=([])).push({n:add,at:Date.now()});session[id]=(session[id]||0)+add;save();render();if(navigator.vibrate)navigator.vibrate(15)}
function undo(id){let h=s.history[id]||[];if(!h.length)return;let x=h.pop();s.reps[id]=Math.max(0,(s.reps[id]||0)-x.n);session[id]=Math.max(0,(session[id]||0)-x.n);save();render()}
function activate(id){if(confirm('Has a GKR instructor checked this advanced technique and cleared you to practise it?')){s.activated[id]=true;save();render()}}
function finish(){go('results')}
function modal(type,id){let d=$('modal');let close=`<button style="float:right" onclick="closeModal()">✕</button>`;if(type==='belt')d.innerHTML=close+'<h2>Visible belt</h2><p class="muted">Changes visible techniques, not your real grade.</p>'+BELTS.map(b=>`<button onclick="s.selectedBelt='${b}';save();closeModal();render()">${b.toUpperCase()}</button>`).join(' ');if(type==='custom')d.innerHTML=close+`<h2>Custom repetitions</h2><input id="num" type="number" inputmode="numeric" min="1" max="10000" placeholder="Number of repetitions"><div class="tabs">${[10,25,50,100].map(x=>`<button onclick="$('num').value=${x}">${x}</button>`).join('')}</div><button class="btn-primary" onclick="let n=Number($('num').value);if(Number.isInteger(n)&&n>0){closeModal();rep('${id}',n)}">ADD</button>`;if(type==='settings')d.innerHTML=close+`<h2>Settings & backup</h2><label>Actual GKR grade</label><select id="actual">${BELTS.map(b=>`<option value="${b}" ${s.actualGrade===b?'selected':''}>${b.toUpperCase()}</option>`).join('')}</select><button onclick="s.actualGrade=$('actual').value;save();closeModal()">SAVE GRADE</button><hr><button onclick="exportData()">EXPORT BACKUP</button><label style="display:block;margin:15px 0">IMPORT BACKUP<input type="file" accept="application/json" onchange="importData(this)"></label><p class="muted">Your progress is stored locally on this device. Export backups regularly.</p><button onclick="reset()">RESET ALL PROGRESS</button>`;$('overlay').classList.add('show')}
function closeModal(){$('overlay').classList.remove('show')}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='10k-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.reps||typeof v.reps!=='object')throw Error();Object.assign(s,v);save();closeModal();render();alert('Backup imported')}catch(e){alert('Invalid backup')}};r.readAsText(f)}function reset(){if(!confirm('Permanently reset all repetitions and history?'))return;s.reps={};s.history={};save();closeModal();go('home')}
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};if(matchMedia('(prefers-reduced-motion: reduce)').matches)$('splash').remove();else setTimeout(()=>$('splash')?.remove(),3300);render();
</script></body></html>
