if(page==='emblems')h=`<div class="section"><div class="eyebrow">HALL OF MASTERY</div><h1 class="title">Earned emblems</h1><p class="sub">Permanent awards. Your repetitions never reset.</p><div class="filter">${['all','strikes','blocks','kicks'].map(c=>`<button class="${(state.emblemCat||'all')===c?'active':''}" onclick="state.emblemCat='${c}';render()">${c.toUpperCase()}</button>`).join('')}</div><div class="medals">${v.filter(t=>(state.emblemCat||'all')==='all'||t.category===state.emblemCat).flatMap(t=>levels.filter(m=>m<=num(t)).map(m=>`<button class="medal" onclick="current='${t.id}';from='emblems';go('milestones')"><div class="coin">✦</div><b>${fmt(m)}</b><small>${t.name}</small></button>`)).join('')||'<p class="sub" style="grid-column:span 3">Your first emblem unlocks at 100 repetitions of a technique.</p>'}</div><h2 class="title" style="margin-top:25px">Technique collection</h2>${v.map(row).join('')}</div>`;

if(page==='history'){let events=T.flatMap(t=>(state.history[t.id]||[]).filter(h=>h.at).map(h=>({...h,name:t.name}))),byday={};events.forEach(x=>{let d=new Date(x.at).toLocaleDateString('en-CA');byday[d]=(byday[d]||0)+x.n});let now=new Date(),year=now.getFullYear(),month=now.getMonth(),days=new Date(year,month+1,0).getDate(),offset=new Date(year,month,1).getDay();h=`<div class="section"><button class="outline" onclick="go('home')">← HOME</button><h1 class="title" style="margin-top:18px">Training history</h1><div class="art" style="height:170px;${art('history')}"></div><h2 class="title" style="margin-top:16px">${now.toLocaleString('en-AU',{month:'long',year:'numeric'})}</h2><div class="cal">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}${Array.from({length:offset},()=>'<div style="visibility:hidden"></div>').join('')}${Array.from({length:days},(_,i)=>{let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<div class="${byday[d]?'done':''}" title="${fmt(byday[d])} repetitions">${i+1}</div>`}).join('')}</div><h2 class="title" style="margin-top:25px">Recent repetitions</h2>${events.sort((a,b)=>b.at-a.at).slice(0,50).map(x=>`<div class="panel between"><div><b>${x.name}</b><div class="sub">${new Date(x.at).toLocaleString('en-AU')}</div></div><b style="color:var(--gold)">+${fmt(x.n)}</b></div>`).join('')||'<p class="sub">Your training activity will appear here.</p>'}</div>`}
if(page==='customize')h=`<div class="section"><button class="outline" onclick="go('home')">← HOME</button><h1 class="title" style="margin-top:18px">Your karateka</h1><div class="art" style="height:380px;${art('karateka')}"></div><p class="sub">Cosmetic preferences only. Your actual GKR belt remains separate.</p><h2 class="title">Gi style</h2><div class="outfits">${['White','Black'].map(x=>`<button class="${(state.gi||'White')===x?'active':''}" onclick="state.gi='${x}';save();render()">${x} gi</button>`).join('')}</div><h2 class="title">Training backdrop</h2><div class="outfits">${['sanctuary','grounds','mountain'].map(x=>`<button class="${(state.backdrop||'sanctuary')===x?'active':''}" onclick="state.backdrop='${x}';save();render()">${x.toUpperCase()}</button>`).join('')}</div><p class="sub">Preferences saved. Character artwork is not yet dynamically recoloured.</p></div>`;
if(page==='results'){let entries=Object.entries(session).filter(([,n])=>n>0),total=entries.reduce((a,[,n])=>a+n,0);h=`<div class="resultart art" style="${art('finish')}"><div class="content"><div class="eyebrow">TRAINING COMPLETE</div><b>+${fmt(total)} REPS</b><p>${entries.length} techniques practised</p></div></div><div class="section">${entries.map(([id,n])=>`<div class="panel between"><span>${T.find(t=>t.id===id)?.name}</span><b style="color:var(--gold)">+${fmt(n)}</b></div>`).join('')||'<p class="sub">No repetitions added this session.</p>'}<button class="gold" style="width:100%;margin-top:15px" onclick="session={};sessionActive=false;go('home')">CONTINUE</button></div>`}
$('main').innerHTML=h;save()}
function row(t){return `<button class="techrow" onclick="openTech('${t.id}')"><span class="thumb" style="background-image:url('${t.category==='kicks'?'practice':t.category==='blocks'?'grounds':'strike'}.jpg')"></span><span class="techinfo"><b>${t.name}</b><small>${t.english}</small><em>${fmt(num(t))} / 10,000</em>${bar(pct(t))}</span><span class="chev">›</span></button>`}function selectCat(c){state.cat=c;go('list')}function openTech(id){current=id;sessionActive=true;go('focus')}function next(d){let a=visible(),i=a.findIndex(t=>t.id===current);if(a[i+d]){current=a[i+d].id;go('focus')}}function activate(){state.activated[current]=true;save();render()}function rep(n){let t=T.find(t=>t.id===current),old=num(t),add=Math.min(10000-old,Math.max(0,Math.floor(n)));if(!add)return;state.reps[t.id]=old+add;(state.history[t.id]||=[]).push({n:add,at:Date.now()});session[t.id]=(session[t.id]||0)+add;save();render();if(levels.some(m=>old<m&&old+add>=m)){from='focus';go('milestones')}try{navigator.vibrate?.(12)}catch(e){}}function undo(){let h=state.history[current]||[],x=h.pop();if(!x)return;state.reps[current]=Math.max(0,num(T.find(t=>t.id===current))-x.n);session[current]=Math.max(0,(session[current]||0)-x.n);save();render()}function finish(){go('results')}function showLocation(i){alert(`${locations[i]} · ${fmt(thresholds[i])} lifetime repetitions. ${sum()>=thresholds[i]?'Reached':'Not yet unlocked.'}`)}
function closeDialog(){$('overlay').classList.remove('show')}function dialogOpen(type){let d=$('dialog'),close=`<button class="outline" onclick="closeDialog()">✕ CLOSE</button>`;if(type==='belts')d.innerHTML=close+'<h2>Visible belt</h2><p class="note">Changes the techniques available to browse, not your official GKR grade.</p>'+BELTS.map(b=>`<button class="outline" onclick="state.selectedBelt='${b}';save();closeDialog();render()">${b.toUpperCase()}</button>`).join('');if(type==='custom')d.innerHTML=close+`<h2>Custom repetitions</h2><input type="number" id="customN" min="1" max="10000" inputmode="numeric" placeholder="Enter reps"><div>${[10,25,50,100].map(n=>`<button class="outline" onclick="$('customN').value=${n}">${n}</button>`).join('')}</div><button class="gold" onclick="let n=Number($('customN').value);if(n>0){closeDialog();rep(n)}">ADD REPS</button>`;if(type==='settings')d.innerHTML=close+`<h2>Settings and backup</h2><label>Actual GKR grade</label><select id="actualGrade">${BELTS.map(b=>`<option value="${b}" ${state.actualGrade===b?'selected':''}>${b.toUpperCase()}</option>`).join('')}</select><button class="gold" onclick="state.actualGrade=$('actualGrade').value;save();closeDialog();render()">SAVE</button><hr><button class="outline" onclick="exportData()">EXPORT BACKUP</button><label class="outline" style="display:inline-block">IMPORT BACKUP<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><p class="note">Repetition counts are saved locally. Export a backup before clearing browser data or switching devices.</p><button class="outline" onclick="resetData()">RESET ALL DATA</button>`;$('overlay').classList.add('show')}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='10K-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.reps||typeof x.reps!=='object')throw Error();state={...state,...x};save();closeDialog();render();alert('Backup imported')}catch(e){alert('Invalid backup')}};r.readAsText(f)}function resetData(){if(!confirm('Delete all local progress? Export a backup first.'))return;state={selectedBelt:'white',actualGrade:'white',cat:'strikes',reps:{},history:{},activated:{}};session={};save();closeDialog();go('home')}
if(matchMedia('(prefers-reduced-motion:reduce)').matches){$('splash').remove()}else setTimeout(()=>$('splash')?.remove(),3400);render();
</script></body></html>
