<script>const T=[{"id":"chudan","name":"Chudan Tsuki","english":"Mid-level Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"jodan","name":"Jodan Tsuki","english":"Head-level Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"shita","name":"Shita Tsuki","english":"Short Punch","category":"strikes","belt":"white","needsCheck":false},{"id":"hijiate","name":"Hijiate","english":"Rising Elbow Strike","category":"strikes","belt":"white","needsCheck":false},{"id":"mawashi-empi","name":"Mawashi Empi","english":"Round Elbow Strike","category":"strikes","belt":"white","needsCheck":false},{"id":"ura","name":"Ura Uchi","english":"Forward Back Fist","category":"strikes","belt":"white","needsCheck":false},{"id":"yoko-ura","name":"Yoko Ura Uchi","english":"Side Back Fist","category":"strikes","belt":"white","needsCheck":false},{"id":"jodan-age","name":"Jodan Age Uke","english":"Head-level / Rising Block","category":"blocks","belt":"white","needsCheck":false},{"id":"uchi-uke","name":"Uchi Uke","english":"Inside Hooking Block","category":"blocks","belt":"white","needsCheck":false},{"id":"soto-uke","name":"Soto Uke","english":"Outside Hooking Block","category":"blocks","belt":"white","needsCheck":false},{"id":"gedan-barai","name":"Gedan Barai","english":"Downward Block","category":"blocks","belt":"white","needsCheck":false},{"id":"gedan-uke","name":"Gedan Uke","english":"Sweeping Block","category":"blocks","belt":"white","needsCheck":false},{"id":"mae-geri","name":"Mae Geri","english":"Front Kick","category":"kicks","belt":"white","needsCheck":false},{"id":"shuto-uchi","name":"Shuto Uchi","english":"Outside Knife-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"gyaku-shuto","name":"Gyaku Shuto Uchi","english":"Inside Knife-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"haito","name":"Haito","english":"Ridge-hand Strike","category":"strikes","belt":"orange","needsCheck":false},{"id":"chuge","name":"Chu-ge Uke","english":"Double Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"kake","name":"Kake Uke","english":"Open-hand Hook Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"mawashi-uke","name":"Mawashi Uke","english":"Open-hand Round Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"shuto-uke","name":"Shuto Uke","english":"Knife-hand Block","category":"blocks","belt":"orange","needsCheck":false},{"id":"kensetsu","name":"Kensetsu Geri","english":"Knee Thrust Kick","category":"kicks","belt":"blue","needsCheck":true},{"id":"mikazuki","name":"Mikazuki Geri","english":"Crescent Kick","category":"kicks","belt":"blue","needsCheck":true},{"id":"sukui","name":"Sukui Uke","english":"Scooping Block","category":"blocks","belt":"blue","needsCheck":true},{"id":"dan-tsuki","name":"Dan Tsuki","english":"Simultaneous Double Punch","category":"strikes","belt":"blue","needsCheck":true},{"id":"jiten-ushiro","name":"Jiten Ushiro Geri","english":"Spinning Back Kick","category":"kicks","belt":"brown","needsCheck":true},{"id":"ushiro-mawashi","name":"Ushiro Mawashi Geri","english":"Hook Kick","category":"kicks","belt":"brown","needsCheck":true}];const BELTS=[['white','White','#eee6cf'],['yellow','Yellow','#c69a1d'],['orange','Orange','#a85c2e'],['green','Green','#4c6741'],['blue','Blue','#3e5063'],['red','Red','#7a352e'],['brown','Brown','#684833'],['black','Black','#27221e']];const rank={white:0,yellow:1,orange:2,green:3,blue:4,red:5,brown:6,black:7};const KEY='ichimanState';let state={selectedBelt:'white',cat:'strikes',actualGrade:'white',reps:{},history:{},activated:{}};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};state.reps||={};state.history||={};state.activated||={};state.migrations||={};if(!state.migrations.chudanTestReset){state.reps['chudan']=0;state.history['chudan']=[];state.migrations.chudanTestReset=true;}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function visible(t){return rank[t.belt]<=rank[state.selectedBelt]}function pct(id){return Math.min(100,(state.reps[id]||0)/100)}function beltName(){return BELTS.find(x=>x[0]===state.selectedBelt)[1].toUpperCase()+' BELT'}
const list=document.getElementById('list'),bamboo=document.getElementById('bamboo'),catLabel=document.getElementById('catLabel');function current(){return T.filter(t=>visible(t)&&t.category===state.cat)}function render(){document.getElementById('beltTitle').textContent=beltName();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.cat===state.cat));let arr=current();catLabel.textContent=state.cat==='strikes'?'STRIKES':state.cat==='blocks'?'BLOCKS':'KICKS';bamboo.innerHTML=arr.map(t=>`<span class="stalk"><i style="--p:${pct(t.id)}%"></i></span>`).join('');list.innerHTML=arr.length?arr.map(row).join(''):`<div style="padding:42px 0;text-align:center;color:#79664d">No new ${state.cat} introduced by this belt.</div>`;bindRows();renderBelts();save()}

const ART={
 punch:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M8 47 C28 45 38 38 54 35 L93 31 111 39 95 47 56 45 C40 52 26 57 8 57Z" fill="#40372d"/><path d="M90 31l13-5 9 7-2 10-16 4" fill="none" stroke="#40372d" stroke-width="5" stroke-linecap="round"/></svg>`,
 highpunch:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M8 56 C29 50 42 39 58 30 L96 18 112 27 98 36 61 41 C43 50 27 60 8 65Z" fill="#40372d"/><path d="M96 18l10-4 7 6-1 10" fill="none" stroke="#40372d" stroke-width="5"/></svg>`,
 shortpunch:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M14 53 C34 48 48 43 61 40 L85 37 99 44 86 51 60 50 C43 55 29 60 14 61Z" fill="#40372d"/><rect x="83" y="34" width="24" height="19" rx="7" fill="#40372d"/></svg>`,
 elbowup:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M18 65 C39 61 49 55 58 43 L72 18 83 23 75 49 C71 61 62 68 48 71Z" fill="#40372d"/><path d="M72 18l6-10 12 7-7 12" fill="#40372d"/></svg>`,
 elbowround:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M17 57 C35 50 46 41 56 31 L76 25 92 36 78 45 61 43 C50 54 39 62 20 67Z" fill="#40372d"/><path d="M83 23c12 4 20 11 25 23" fill="none" stroke="#40372d" stroke-width="5" stroke-linecap="round"/></svg>`,
 backfist:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M13 54 C31 50 43 43 57 36 L91 31 104 39 93 47 58 45 C43 52 30 59 13 62Z" fill="#40372d"/><path d="M96 28l15 6-3 12-15 3" fill="none" stroke="#40372d" stroke-width="5"/></svg>`,
 blockup:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M31 68 C42 52 51 40 61 29 L82 11 92 21 75 42 58 57 49 72Z" fill="#40372d"/><path d="M54 26c15-8 29-11 43-9" fill="none" stroke="#40372d" stroke-width="6" stroke-linecap="round"/></svg>`,
 blockside:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M24 62 C39 54 48 45 56 34 L71 17 82 24 72 43 59 57 42 69Z" fill="#40372d"/><path d="M69 19c12 5 21 14 28 27" fill="none" stroke="#40372d" stroke-width="6" stroke-linecap="round"/></svg>`,
 blockdown:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M28 18 C43 27 53 38 62 50 L83 67 92 57 75 39 58 25 42 13Z" fill="#40372d"/><path d="M61 50c14 5 26 5 39 1" fill="none" stroke="#40372d" stroke-width="6" stroke-linecap="round"/></svg>`,
 openhand:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M12 55 C34 49 47 41 61 34 L89 30 91 44 61 46 C45 54 31 60 12 63Z" fill="#40372d"/><path d="M89 30l20-10M90 34l22-4M91 38l21 3M90 42l18 8" stroke="#40372d" stroke-width="4" stroke-linecap="round"/></svg>`,
 kick:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><path d="M10 60 C31 55 45 47 58 37 L91 24 108 31 96 41 65 48 C49 59 34 66 14 70Z" fill="#40372d"/><path d="M91 24l12-7 11 8-6 9" fill="#40372d"/></svg>`};
function artFor(t){if(t.category==='kicks')return ART.kick;if(/Jodan Tsuki/.test(t.name))return ART.highpunch;if(/Chudan Tsuki/.test(t.name))return ART.punch;if(/Shita Tsuki/.test(t.name))return ART.shortpunch;if(/Hijiate/.test(t.name))return ART.elbowup;if(/Empi/.test(t.name))return ART.elbowround;if(/Ura Uchi/.test(t.name))return ART.backfist;if(/Age Uke/.test(t.name))return ART.blockup;if(/Gedan/.test(t.name))return ART.blockdown;if(/Shuto|Haito|Kake|Mawashi Uke/.test(t.name))return ART.openhand;if(t.category==='blocks')return ART.blockside;return ART.punch}
function artUrl(t){return `url("data:image/svg+xml,${encodeURIComponent(artFor(t))}")`}

function row(t){let n=state.reps[t.id]||0,active=!t.needsCheck||state.activated[t.id],done=n>=10000;return `<section class="tech" data-id="${t.id}" style="--tech-art:${artUrl(t)}"><div class="tech-top"><div><h2>${t.name}</h2><div class="eng">${t.english}</div></div>${done?'<span class="complete">10,000 ✓</span>':''}</div><div class="countline"><span class="count">${n.toLocaleString()} / 10,000</span><span class="bar"><i style="--p:${pct(t.id)}%"></i></span></div>${!active?`<div class="lockednote">Activate after your instructor has introduced this technique.</div><button class="activate" data-activate>INSTRUCTOR CHECKED · ACTIVATE</button>`:done?'':`<div class="controls"><button class="add" data-add="10">+10</button><button class="add" data-add="100">+100</button><button data-custom>+</button><button class="undo" data-undo ${!(state.history[t.id]||[]).length?'disabled':''} aria-label="Undo last addition">↶</button></div>`}</section>`}
function motion(id,label,kind='add'){requestAnimationFrame(()=>{let el=document.querySelector(`.tech[data-id="${id}"]`);if(!el)return;el.classList.add(kind==='undo'?'undo-hit':'rep-hit');let c=el.querySelector('.count');if(c)c.classList.add('bump');let bar=el.querySelector('.bar i');if(bar)bar.classList.add('grow');let f=document.createElement('span');f.className='float-rep'+(kind==='undo'?' undo-float':'');f.textContent=label;el.appendChild(f);setTimeout(()=>f.remove(),800);document.querySelectorAll('.stalk i').forEach(x=>x.classList.add('grow'))})}
function haptic(){try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}}
function add(id,n){let old=state.reps[id]||0,actual=Math.min(n,10000-old);if(actual<=0)return;state.reps[id]=old+actual;(state.history[id]||(state.history[id]=[])).push({n:actual,at:Date.now()});save();render();motion(id,'+'+actual);haptic();toast('+'+actual+' added')};function undo(id){let h=state.history[id]||[];let last=h.pop();if(!last)return;state.reps[id]=Math.max(0,(state.reps[id]||0)-last.n);save();render();motion(id,'↶ '+last.n,'undo');haptic();toast('Undone')}
function bindRows(){document.querySelectorAll('.tech').forEach(el=>{let id=el.dataset.id;el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(id,+b.dataset.add));let u=el.querySelector('[data-undo]');if(u)u.onclick=()=>undo(id);let c=el.querySelector('[data-custom]');if(c)c.onclick=()=>openCustom(id);let a=el.querySelector('[data-activate]');if(a)a.onclick=()=>{state.activated[id]=true;save();render()}})}
function renderBelts(){let box=document.getElementById('belts');box.innerHTML=BELTS.map(b=>`<button data-belt="${b[0]}" class="${state.selectedBelt===b[0]?'on':''}"><div class="belt-knot" style="--c:${b[2]}"></div>${b[1]}</button>`).join('');box.querySelectorAll('button').forEach(x=>x.onclick=()=>{state.selectedBelt=x.dataset.belt;save();closeAll();render();let bb=document.getElementById('beltBtn');bb.classList.remove('belt-settle');void bb.offsetWidth;bb.classList.add('belt-settle');haptic()})}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(state.cat===b.dataset.cat)return;state.cat=b.dataset.cat;render();list.classList.remove('tab-enter');void list.offsetWidth;list.classList.add('tab-enter');haptic()});document.getElementById('beltBtn').onclick=()=>document.getElementById('beltPop').classList.add('show');document.getElementById('gear').onclick=()=>document.getElementById('settings').classList.add('show');document.querySelectorAll('.close').forEach(x=>x.onclick=closeAll);document.querySelectorAll('.belt-pop,.settings,.modal').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)closeAll()}));function closeAll(){document.querySelectorAll('.show').forEach(x=>x.classList.remove('show'))}
let customId=null;function openCustom(id){customId=id;document.getElementById('modalName').textContent=T.find(t=>t.id===id).name;document.getElementById('customNum').value='';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('customNum').focus(),100)}document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>document.getElementById('customNum').value=b.textContent);document.getElementById('confirm').onclick=()=>{let n=+document.getElementById('customNum').value;if(n>0){closeAll();add(customId,n)}};
const ag=document.getElementById('actualGrade');ag.innerHTML=BELTS.map(b=>`<option value="${b[0]}">${b[1]} Belt</option>`).join('');ag.value=state.actualGrade;ag.onchange=()=>{state.actualGrade=ag.value;save()};document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='10k-backup.json';a.click()};document.getElementById('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{state=JSON.parse(r.result);save();closeAll();render();toast('Backup imported')}catch(e){toast('Invalid backup')}};r.readAsText(f)};document.getElementById('reset').onclick=()=>{if(confirm('Reset all 10K progress?')){state={selectedBelt:'white',cat:'strikes',actualGrade:'white',reps:{},history:{},activated:{}};save();closeAll();render()}};function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.getElementById('splash').classList.add('reduce-hide')}else{setTimeout(()=>document.getElementById('splash')?.remove(),3650)};
render();</script></body></html>
