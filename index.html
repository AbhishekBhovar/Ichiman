</style></head><body><main class="app"><section class="hero"><button class="gear" id="gear" aria-label="Settings">settings</button></section><div class="beltbar"><button class="beltbtn" id="beltBtn">WHITE BELT⌄</button></div><nav class="tabs"><button class="tab active" data-c="strikes">STRIKES</button><button class="tab" data-c="blocks">BLOCKS</button><button class="tab" data-c="kicks">KICKS</button></nav><section class="list" id="list"></section></main>
<div class="overlay" id="customOverlay"><div class="panel"><h2 id="customTitle">Add reps</h2><input id="customInput" type="number" inputmode="numeric" min="1" max="10000" placeholder="Number of reps"><div class="presets"><button data-p="10">10</button><button data-p="25">25</button><button data-p="50">50</button><button data-p="100">100</button></div><button class="primary" id="customAdd">ADD</button><button class="secondary close">CANCEL</button></div></div>
<div class="overlay" id="beltOverlay"><div class="panel"><h2>Choose belt</h2><div class="beltgrid" id="beltGrid"></div><button class="secondary close">CANCEL</button></div></div>
<div class="overlay" id="settingsOverlay"><div class="panel"><h2>Settings</h2><div class="settingsrow"><button id="exportBtn">EXPORT BACKUP</button><label class="filelabel">IMPORT BACKUP<input id="importFile" type="file" accept="application/json" hidden></label><button class="danger" id="resetBtn">RESET ALL REPS</button></div><button class="secondary close">CLOSE</button></div></div><div class="toast" id="toast"></div>
<script>
const T=[{"id":"chudan","name":"Chudan Tsuki","english":"Mid-level Punch","category":"strikes","belt":"white"},{"id":"jodan","name":"Jodan Tsuki","english":"Head-level Punch","category":"strikes","belt":"white"},{"id":"shita","name":"Shita Tsuki","english":"Short Punch","category":"strikes","belt":"white"},{"id":"hijiate","name":"Hijiate","english":"Rising Elbow Strike","category":"strikes","belt":"white"},{"id":"mawashi-empi","name":"Mawashi Empi","english":"Round Elbow Strike","category":"strikes","belt":"white"},{"id":"ura","name":"Ura Uchi","english":"Forward Back Fist","category":"strikes","belt":"white"},{"id":"yoko-ura","name":"Yoko Ura Uchi","english":"Side Back Fist","category":"strikes","belt":"white"},{"id":"jodan-age","name":"Jodan Age Uke","english":"Head-level Block","category":"blocks","belt":"white"},{"id":"uchi-uke","name":"Uchi Uke","english":"Inside Hooking Block","category":"blocks","belt":"white"},{"id":"soto-uke","name":"Soto Uke","english":"Outside Hooking Block","category":"blocks","belt":"white"},{"id":"gedan-barai","name":"Gedan Barai","english":"Downward Block","category":"blocks","belt":"white"},{"id":"gedan-uke","name":"Gedan Uke","english":"Sweeping Block","category":"blocks","belt":"white"},{"id":"mae-geri","name":"Mae Geri","english":"Front Kick","category":"kicks","belt":"white"},{"id":"shuto-uchi","name":"Shuto Uchi","english":"Outside Knife-hand Strike","category":"strikes","belt":"orange"},{"id":"gyaku-shuto","name":"Gyaku Shuto Uchi","english":"Inside Knife-hand Strike","category":"strikes","belt":"orange"},{"id":"haito","name":"Haito","english":"Ridge-hand Strike","category":"strikes","belt":"orange"},{"id":"chuge","name":"Chu-ge Uke","english":"Double Block","category":"blocks","belt":"orange"},{"id":"kake","name":"Kake Uke","english":"Open-hand Hook Block","category":"blocks","belt":"orange"},{"id":"mawashi-uke","name":"Mawashi Uke","english":"Open-hand Round Block","category":"blocks","belt":"orange"},{"id":"shuto-uke","name":"Shuto Uke","english":"Knife-hand Block","category":"blocks","belt":"orange"},{"id":"kensetsu","name":"Kensetsu Geri","english":"Knee Thrust Kick","category":"kicks","belt":"blue"},{"id":"mikazuki","name":"Mikazuki Geri","english":"Crescent Kick","category":"kicks","belt":"blue"},{"id":"sukui","name":"Sukui Uke","english":"Scooping Block","category":"blocks","belt":"blue"},{"id":"dan-tsuki","name":"Dan Tsuki","english":"Simultaneous Double Punch","category":"strikes","belt":"blue"},{"id":"jiten-ushiro","name":"Jiten Ushiro Geri","english":"Spinning Back Kick","category":"kicks","belt":"brown"},{"id":"ushiro-mawashi","name":"Ushiro Mawashi Geri","english":"Hook Kick","category":"kicks","belt":"brown"}];
const belts=['white','yellow','orange','green','blue','red','brown','black']; const beltOrder={white:0,yellow:1,orange:2,green:3,blue:4,red:5,brown:6,black:7};
let S;try{S=JSON.parse(localStorage.getItem('ichimanState')||'null')}catch(e){};S=S||{belt:'white',cat:'strikes',actual:'white',reps:{},history:{},activated:{}};S.reps=S.reps||{};S.history=S.history||{};S.belt=S.belt||'white';S.cat=S.cat||'strikes';
const save=()=>localStorage.setItem('ichimanState',JSON.stringify(S)); const cap=n=>Math.max(0,Math.min(10000,n));
function available(t){return beltOrder[t.belt]<=beltOrder[S.belt]}
function render(){document.getElementById('beltBtn').textContent=S.belt.toUpperCase()+' BELT ⌄';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.c===S.cat));const rows=T.filter(t=>t.category===S.cat&&available(t));document.getElementById('list').innerHTML=rows.map(t=>{let r=S.reps[t.id]||0,p=r/100;let can=(S.history[t.id]||[]).length>0;return `<article class="tech"><div class="top"><div class="name">${t.name}</div><div class="eng">${t.english}</div></div><div class="mid"><div class="count">${r.toLocaleString()} / 10,000</div><div class="track"><div class="fill" style="width:${p}%"></div></div></div><div class="actions"><button class="act" onclick="add('${t.id}',10)">+10</button><button class="act" onclick="add('${t.id}',100)">+100</button><button class="act custom" onclick="openCustom('${t.id}')">+</button><button class="act undo" ${can?'':'disabled'} onclick="undo('${t.id}')" aria-label="Undo last addition">↶</button></div></article>`}).join('')||'<div class="tech"><b>No new techniques at this belt.</b><div class="eng" style="margin-top:5px">Earlier techniques remain available by selecting an earlier belt.</div></div>';save()}
function add(id,n){let before=S.reps[id]||0,after=cap(before+n);if(after===before)return;(S.history[id]||(S.history[id]=[])).push({amount:after-before,at:Date.now()});S.reps[id]=after;save();render();toast('+'+(after-before)+' reps')}
function undo(id){let h=S.history[id]||[];let last=h.pop();if(!last)return;S.reps[id]=cap((S.reps[id]||0)-last.amount);save();render();toast('Undone')}
let customId=null;function openCustom(id){customId=id;document.getElementById('customTitle').textContent='Add reps · '+T.find(t=>t.id===id).name;document.getElementById('customInput').value='';show('customOverlay');setTimeout(()=>document.getElementById('customInput').focus(),80)}
function show(id){document.getElementById(id).classList.add('show')}function hideAll(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'))}
document.querySelectorAll('.close').forEach(b=>b.onclick=hideAll);document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)hideAll()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>document.getElementById('customInput').value=b.dataset.p);document.getElementById('customAdd').onclick=()=>{let n=parseInt(document.getElementById('customInput').value,10);if(n>0){add(customId,n);hideAll()}};
document.getElementById('beltBtn').onclick=()=>show('beltOverlay');document.getElementById('beltGrid').innerHTML=belts.map(b=>`<button data-b="${b}">${b.toUpperCase()} BELT</button>`).join('');document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.belt=b.dataset.b;hideAll();render()});
document.getElementById('gear').onclick=()=>show('settingsOverlay');document.getElementById('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='ichiman-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(x&&x.reps){S=x;save();hideAll();render();toast('Backup imported')}}catch(err){alert('That backup file could not be read.')}};rd.readAsText(f)};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset every ICHIMAN rep counter?')){S.reps={};S.history={};save();hideAll();render();toast('All reps reset')}};
let tt;function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('show'),1200)}render();
</script></body></html>
